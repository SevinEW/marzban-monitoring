name: build-latest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marzwatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Apply final build transforms
        run: |
          python3 scripts/apply_hud_v2.py
          python3 scripts/apply_hud_v3.py
          python3 scripts/apply_fleet_update.py
          python3 scripts/apply_forum_live.py
          python3 scripts/apply_forum_first_install.py
          python3 scripts/apply_live_refresh.py
          python3 scripts/apply_telegram_rate_limit.py
          python3 scripts/apply_forum_reliability.py
          python3 scripts/apply_synchronized_telemetry.py
          python3 scripts/apply_location_topics.py
          python3 scripts/apply_node_identity.py
          python3 scripts/apply_custom_emoji.py
          python3 scripts/apply_expiry_ip.py
          python3 scripts/apply_iran_day.py
          python3 scripts/apply_pg_traffic.py
          gofmt -w cmd internal

      - name: Test
        run: |
          node --check internal/central/web/app.js
          node scripts/check-web-precision.cjs
          python3 scripts/test_pg_meter.py
          python3 -m unittest discover -s scripts -p test_online_presence.py
          python3 -m unittest discover -s scripts -p test_presence_recovery.py
          python3 -m unittest discover -s scripts -p test_presence_fleet.py
          python3 -m unittest discover -s scripts -p test_presence_auto.py
          python3 scripts/test_release_download.py
          go test -race ./...
          go vet ./...
          bash -n scripts/install.sh
          bash -n scripts/auto-update.sh

      - name: Build Linux binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/marzwatch-linux-amd64 ./cmd/marzwatch
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/marzwatch-linux-arm64 ./cmd/marzwatch
          cp scripts/auto-update.sh dist/marzwatch-auto-update.sh
          chmod 0755 dist/marzwatch-auto-update.sh
          (cd dist && sha256sum marzwatch-linux-amd64 marzwatch-linux-arm64 marzwatch-auto-update.sh > SHA256SUMS)

      - name: Replace latest release safely
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create latest \
            dist/marzwatch-linux-amd64 \
            dist/marzwatch-linux-arm64 \
            dist/marzwatch-auto-update.sh \
            dist/SHA256SUMS \
            --title 'MarzWatch Latest' \
            --notes 'Automatically enroll uniquely matched PasarGuard and monitoring nodes over authenticated links. Opt-in Central policy can enable online tracking with one guarded restart of a new node, preserving shared configurations and existing nodes. Bounded read-only snapshots, runtime traffic proofs, durable activation journal, rollback and dynamic dashboard coverage. Counts represent online accounts, not physical devices.' \
            --latest \
            --target "${GITHUB_SHA}"
